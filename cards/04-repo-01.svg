<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img">
<title>Nishit Soni GitHub profile card</title><style>@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
        @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
        @keyframes sweep{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
        .enter{animation:rise .75s cubic-bezier(.2,.8,.2,1) both}
        .glow{animation:pulse 2.4s ease-in-out infinite}
        .floaty{animation:floaty 3.2s ease-in-out infinite}
        .bar-sweep{stroke-dasharray:800;animation:sweep 1.1s ease-out both}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}animate,animateTransform,set{display:none!important}.enter{opacity:1;transform:none}.glow{opacity:1}.floaty{transform:none}.bar-sweep{stroke-dashoffset:0}}text{font-family:Roboto,Arial,sans-serif}.fg{fill:#F7F7E8}.muted{fill:#B8B89F}.green{fill:#DFFF00}</style>
<rect x="1" y="1" width="798" height="258" rx="2" fill="#050505" stroke="#3A3A20"/><rect class="glow" x="1" y="1" width="798" height="4" fill="#DFFF00"/><g class="enter" style="animation-delay:0.34s"><text x="30" y="39" class="green" font-size="10" letter-spacing="2">FEATURED PROJECT / 01</text><text x="30" y="84" class="fg" font-size="23" font-weight="900">Cloudinary Studio</text><text x="30" y="122" class="muted" font-size="13">Media workspace for uploading, optimizing, transforming images/videos &amp; background removal.</text><path class="bar-sweep" d="M30 151H770" stroke="#3A3A20"/><text x="30" y="184" class="green" font-size="11">Next.js · Cloudinary · Prisma · PostgreSQL · Clerk</text><a xlink:href="https://cloudinary-saas-teal.vercel.app/"><g class="floaty" style="animation-delay:0.25s"><rect x="610" y="197" width="160" height="38" fill="#DFFF00"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.20s" repeatCount="indefinite"/></rect><text x="690" y="221" text-anchor="middle" fill="#000000" font-size="11" font-weight="800">EXPLORE PROJECT ↗</text></g></a></g></svg>