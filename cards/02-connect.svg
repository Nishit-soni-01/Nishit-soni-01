lly</text></g></a><a class="enter" style="animation-delay:0.50s" xlink:href="https://leetcode.com/"><g class="floaty" style="animation-delay:0.70s"><rect x="530" y="74" width="232" height="106" rx="2" fill="#10110A" stroke="#3A3A20"/><text x="548" y="102" class="green" font-size="10" letter-spacing="1.4">03 / LINK</text><text x="744" y="103" text-anchor="end" class="green" font-size="16"><animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" begin="0.50s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;3,-3;0,0" dur="2.2s" begin="0.50s" repeatCount="indefinite"/>↗</text><text x="548" y="135" class="fg" font-size="18" font-weight="800">LEETCODE</text><text x="548" y="160" class="muted" font-size="11">Problem-solving journey</text></g></a></svg>