<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="275" viewBox="0 0 800 275" role="img">
<title>Nishit Soni GitHub profile card</title><style>@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
        @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
        @keyframes sweep{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
        .enter{animation:rise .75s cubic-bezier(.2,.8,.2,1) both}
        .glow{animation:pulse 2.4s ease-in-out infinite}
        .floaty{animation:floaty 3.2s ease-in-out infinite}
        .bar-sweep{stroke-dasharray:800;animation:sweep 1.1s ease-out both}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}animate,animateTransform,set{display:none!important}.enter{opacity:1;transform:none}.glow{opacity:1}.floaty{transform:none}.bar-sweep{stroke-dashoffset:0}}text{font-family:Roboto,Arial,sans-serif}.fg{fill:#F7F7E8}.muted{fill:#B8B89F}.green{fill:#DFFF00}</style>
<rect x="1" y="1" width="798" height="273" rx="2" fill="#050505" stroke="#3A3A20"/><rect class="glow" x="1" y="1" width="798" height="4" fill="#DFFF00"/><g class="enter"><text x="38" y="42" class="green" font-size="11" letter-spacing="2.5">A LITTLE ABOUT ME</text><text x="38" y="86" class="fg" font-size="25" font-weight="900">CURIOUS BY NATURE. BUILDER BY CHOICE.</text><text x="38" y="128" class="muted" font-size="14">I'm Nishit Soni, an aspiring AI/ML Engineer and Software Developer.</text><text x="38" y="157" class="muted" font-size="14">I enjoy building intelligent systems, data-driven solutions and full-stack</text><text x="38" y="186" class="muted" font-size="14">experiences that solve real-world problems.</text><path class="bar-sweep" d="M38 213H762" stroke="#3A3A20"/><text x="38" y="245" class="green glow" font-size="11" letter-spacing="1.2">AI / MACHINE LEARNING</text><text x="290" y="245" class="green glow" style="animation-delay:.4s" font-size="11" letter-spacing="1.2">DATA SCIENCE</text><text x="500" y="245" class="green glow" style="animation-delay:.8s" font-size="11" letter-spacing="1.2">FULL-STACK DEVELOPMENT</text></g></svg>