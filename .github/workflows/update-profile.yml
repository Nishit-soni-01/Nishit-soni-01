
name: Update GitHub Profile Cards

on:
  schedule:
    # Runs daily at 00:17 UTC (05:47 IST)
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_contributions.py

      - name: Regenerate profile cards
        run: python render_profile_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.json cards/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub profile cards"
            git push
          else
            echo "No profile changes to commit."
          fi
