<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img">
<title>Nishit Soni GitHub profile card</title><style>@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
        @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
        @keyframes sweep{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
        .enter{animation:rise .75s cubic-bezier(.2,.8,.2,1) both}
        .glow{animation:pulse 2.4s ease-in-out infinite}
        .floaty{animation:floaty 3.2s ease-in-out infinite}
        .bar-sweep{stroke-dasharray:800;animation:sweep 1.1s ease-out both}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}animate,animateTransform,set{display:none!important}.enter{opacity:1;transform:none}.glow{opacity:1}.floaty{transform:none}.bar-sweep{stroke-dashoffset:0}}text{font-family:Roboto,Arial,sans-serif}.fg{fill:#F7F7E8}.muted{fill:#B8B89F}.green{fill:#DFFF00}</style>
<rect x="1" y="1" width="798" height="298" rx="2" fill="#050505" stroke="#3A3A20"/><rect class="glow" x="1" y="1" width="798" height="4" fill="#DFFF00"/><g class="enter"><text x="42" y="50" class="green" font-size="12" letter-spacing="3">HELLO, WELCOME TO MY GITHUB</text><text x="40" y="111" class="fg" font-size="43" font-weight="900">NISHIT SONI.</text><text x="42" y="153" class="muted" font-size="16">I build intelligent systems and digital experiences that solve real-world problems.</text><text x="42" y="202" class="green glow" font-size="12" letter-spacing="1.4">AI/ML ENGINEER  ✳  SOFTWARE DEVELOPER  ✳  DATA SCIENCE</text></g><path class="bar-sweep" d="M42 246H758" stroke="#3A3A20"/><g class="enter" style="animation-delay:.35s"><text x="42" y="278" class="muted" font-size="11">BASED IN INDIA · CREATING WITH PURPOSE</text><text x="758" y="278" text-anchor="end" class="green" font-size="11">01 / INTRODUCTION</text></g></svg>