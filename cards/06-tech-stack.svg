<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" role="img">
<title>Nishit Soni GitHub profile card</title><style>@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
        @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
        @keyframes sweep{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
        .enter{animation:rise .75s cubic-bezier(.2,.8,.2,1) both}
        .glow{animation:pulse 2.4s ease-in-out infinite}
        .floaty{animation:floaty 3.2s ease-in-out infinite}
        .bar-sweep{stroke-dasharray:800;animation:sweep 1.1s ease-out both}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}animate,animateTransform,set{display:none!important}.enter{opacity:1;transform:none}.glow{opacity:1}.floaty{transform:none}.bar-sweep{stroke-dashoffset:0}}text{font-family:Roboto,Arial,sans-serif}.fg{fill:#F7F7E8}.muted{fill:#B8B89F}.green{fill:#DFFF00}</style>
<rect x="1" y="1" width="798" height="288" rx="2" fill="#050505" stroke="#3A3A20"/><rect class="glow" x="1" y="1" width="798" height="4" fill="#DFFF00"/><g class="enter"><text x="38" y="38" class="fg" font-size="24" font-weight="900">TOOLS I BUILD WITH.</text><text x="762" y="38" text-anchor="end" class="green glow" font-size="10" letter-spacing="1.5">MY TECH STACK</text><path class="bar-sweep" d="M38 57H762" stroke="#3A3A20"/></g><g class="enter" style="animation-delay:0.18s"><text x="38" y="88" class="green" font-size="10" letter-spacing="1.8">LANGUAGES</text><text x="260" y="88" class="fg" font-size="13">Python  /  JavaScript  /  Java  /  C  /  C++  /  R  /  SQL</text></g><g class="enter" style="animation-delay:0.32s"><text x="38" y="128" class="green" font-size="10" letter-spacing="1.8">FRONTEND &amp; BACKEND</text><text x="260" y="128" class="fg" font-size="13">React  /  Redux Toolkit  /  Node.js  /  Express  /  Next.js  /  Tailwind CSS</text></g><g class="enter" style="animation-delay:0.46s"><text x="38" y="168" class="green" font-size="10" letter-spacing="1.8">AI / ML &amp; DATA</text><text x="260" y="168" class="fg" font-size="13">TensorFlow  /  PyTorch  /  Scikit-learn  /  Pandas  /  NumPy  /  NLP  /  CNN</text></g><g class="enter" style="animation-delay:0.60s"><text x="38" y="208" class="green" font-size="10" letter-spacing="1.8">DATABASES, CLOUD &amp; TOOLS</text><text x="260" y="208" class="fg" font-size="13">PostgreSQL  /  MySQL  /  MongoDB  /  AWS  /  Azure  /  Docker  /  Git</text></g><g class="enter" style="animation-delay:.74s"><path class="bar-sweep" d="M38 239H762" stroke="#3A3A20"/><text x="38" y="267" class="muted" font-size="10">ALWAYS LEARNING. ALWAYS BUILDING.</text></g></svg>