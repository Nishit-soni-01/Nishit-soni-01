<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img">
<title>Nishit Soni GitHub profile card</title><style>@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
        @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
        @keyframes sweep{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
        .enter{animation:rise .75s cubic-bezier(.2,.8,.2,1) both}
        .glow{animation:pulse 2.4s ease-in-out infinite}
        .floaty{animation:floaty 3.2s ease-in-out infinite}
        .bar-sweep{stroke-dasharray:800;animation:sweep 1.1s ease-out both}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}animate,animateTransform,set{display:none!important}.enter{opacity:1;transform:none}.glow{opacity:1}.floaty{transform:none}.bar-sweep{stroke-dashoffset:0}}text{font-family:Roboto,Arial,sans-serif}.fg{fill:#F7F7E8}.muted{fill:#B8B89F}.green{fill:#DFFF00}</style>
